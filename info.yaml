project:
  title: "TinyScope-32"
  author: "Howard Lee"
  discord: ""
  description: "Four-channel logic analyzer with programmable mask/value trigger and 32-sample circular buffer"
  language: "Verilog"
  clock_hz: 1000000
  tiles: "1x2"
  top_module: "tt_um_howardlee_logic_analyzer_4ch"
  source_files:
    - "project.v"
    - "logic_analyzer_4ch.v"

pinout:
  ui[0]: "CH0"
  ui[1]: "CH1"
  ui[2]: "CH2"
  ui[3]: "CH3"
  ui[4]: "ARM"
  ui[5]: "RD_ADDR0"
  ui[6]: "RD_ADDR1"
  ui[7]: "RD_ADDR2"
  uo[0]: "RD_CH0"
  uo[1]: "RD_CH1"
  uo[2]: "RD_CH2"
  uo[3]: "RD_CH3"
  uo[4]: "DONE"
  uo[5]: "READY_TO_TRIGGER"
  uo[6]: ""
  uo[7]: ""
  uio[0]: "TRIG_VALUE0 / RD_ADDR3"
  uio[1]: "TRIG_VALUE1 / RD_ADDR4"
  uio[2]: "TRIG_VALUE2"
  uio[3]: "TRIG_VALUE3"
  uio[4]: "TRIG_MASK0"
  uio[5]: "TRIG_MASK1"
  uio[6]: "TRIG_MASK2"
  uio[7]: "TRIG_MASK3"

yaml_version: 6
